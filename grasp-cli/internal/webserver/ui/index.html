<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grasp</title>
<style>
:root {
  --bg: #0d1117; --panel: #161b22; --panel2: #1c2129; --border: #30363d;
  --text: #c9d1d9; --dim: #8b949e; --accent: #58a6ff;
  --added: #3fb950; --modified: #d29922; --removed: #f85149;
  --add-bg: rgba(63,185,80,.12); --del-bg: rgba(248,81,73,.12);
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 -apple-system, system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border); flex: none; }
header .logo { font-weight: 700; color: var(--accent); }
header .review-line { color: var(--dim); font-family: var(--mono); font-size: 12px; }
header .counts { color: var(--dim); font-size: 12px; }
header .spacer { flex: 1; }
button, .btn { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
button:hover { border-color: var(--dim); }
button.on { background: var(--accent); color: #0d1117; border-color: var(--accent); }
kbd { font-family: var(--mono); font-size: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; color: var(--dim); }

#layout { display: flex; flex: 1; min-height: 0; }
#sidebar { width: 300px; flex: none; background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; padding: 10px; }
#sidebar h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 14px 4px 6px; }
#filter { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 5px 8px; font-size: 12px; outline: none; }
#filter:focus { border-color: var(--accent); }
.side-mod { margin: 2px 0; }
.side-mod > summary, .side-modlabel { font-family: var(--mono); font-size: 11px; color: var(--dim); cursor: pointer; padding: 2px 4px; word-break: break-all; }
.side-fn { display: flex; align-items: center; gap: 6px; padding: 2px 4px 2px 14px; border-radius: 5px; cursor: pointer; font-family: var(--mono); font-size: 12px; word-break: break-all; }
.side-fn:hover { background: var(--panel2); }
.badge { flex: none; width: 14px; height: 14px; border-radius: 4px; font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; color: #0d1117; }
.badge.added { background: var(--added); } .badge.modified { background: var(--modified); }
.badge.removed { background: var(--removed); } .badge.unchanged { background: var(--border); color: var(--dim); }
.side-empty { color: var(--dim); padding: 4px; font-size: 12px; }

#canvasWrap { flex: 1; overflow: auto; position: relative; }
#edges { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 0; }
#canvas { position: relative; z-index: 1; display: flex; align-items: flex-start; gap: 28px; padding: 20px; min-height: 100%; width: max-content; }
#empty { color: var(--dim); padding: 40px; font-size: 13px; }

.card { width: 620px; flex: none; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.card.focused { border-color: var(--accent); }
.card.removed-card { border-color: rgba(248,81,73,.4); }
.card.flash { animation: flash .6s; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: none; } }
.card-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--panel2); border-bottom: 1px solid var(--border); }
.card-title { font-family: var(--mono); font-size: 13px; font-weight: 600; word-break: break-all; }
.card-title .arity { color: var(--dim); font-weight: 400; }
.card-sub { display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 11px; color: var(--dim); flex-wrap: wrap; }
.card-sub a { color: var(--dim); text-decoration: none; }
.card-sub a:hover { color: var(--accent); }
.chip { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 0 7px; font-size: 10px; }
.dstat { font-family: var(--mono); font-size: 11px; }
.dstat .plus { color: var(--added); } .dstat .minus { color: var(--removed); }
.card-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.card-actions button { padding: 1px 8px; font-size: 11px; }
.card-body { overflow-x: auto; max-height: 68vh; overflow-y: auto; }
table.code { border-collapse: collapse; font-family: var(--mono); font-size: 12px; width: 100%; }
table.code td { padding: 0 8px 0 0; white-space: pre; vertical-align: top; }
td.ln { text-align: right; color: var(--dim); user-select: none; min-width: 44px; cursor: pointer; padding: 0 6px; position: relative; }
td.ln:hover { color: var(--accent); background: var(--panel2); }
td.ln:hover::after { content: "+"; position: absolute; left: 2px; }
td.ln.old { min-width: 36px; }
tr.add { background: var(--add-bg); } tr.del { background: var(--del-bg); }
td.sign { width: 14px; color: var(--dim); user-select: none; }
tr.add td.sign { color: var(--added); } tr.del td.sign { color: var(--removed); }
a.call { color: var(--accent); text-decoration: underline dotted; cursor: pointer; }
a.call:hover { text-decoration: underline; }
tr.fold td { color: var(--dim); cursor: pointer; background: var(--panel2); padding: 2px 12px; font-size: 11px; }
tr.fold td:hover { color: var(--accent); }

.thread { margin: 6px 12px 8px 52px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-family: -apple-system, system-ui, sans-serif; white-space: normal; }
.thread.resolved { opacity: .6; }
.thread .cmt { margin-bottom: 8px; }
.thread .who { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--dim); margin-bottom: 2px; }
.avatar { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: #0d1117; font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.thread .body { white-space: pre-wrap; word-break: break-word; font-size: 12.5px; }
.thread-actions { display: flex; gap: 6px; margin-top: 6px; }
.thread-actions button { font-size: 11px; padding: 1px 8px; }
.pub { font-size: 10px; color: var(--added); }
.composer textarea, .thread textarea { width: 100%; min-height: 56px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font: 12.5px/1.4 -apple-system, system-ui, sans-serif; resize: vertical; outline: none; }
.composer textarea:focus, .thread textarea:focus { border-color: var(--accent); }
.composer { margin: 6px 12px 8px 52px; }
.composer .row { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
.composer .hint { color: var(--dim); font-size: 11px; margin-left: auto; }

#palette { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50; display: flex; justify-content: center; padding-top: 12vh; }
#palette[hidden] { display: none; }
#palette .box { width: 640px; max-height: 60vh; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 16px 48px rgba(0,0,0,.6); }
#palette input { background: var(--bg); border: none; border-bottom: 1px solid var(--border); color: var(--text); padding: 12px 14px; font-size: 14px; outline: none; font-family: var(--mono); }
#palette ul { list-style: none; margin: 0; padding: 6px; overflow-y: auto; }
#palette li { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-family: var(--mono); font-size: 12px; }
#palette li .file { margin-left: auto; color: var(--dim); font-size: 10px; }
#palette li.sel, #palette li:hover { background: var(--panel2); }
</style>
</head>
<body>
<header>
  <span class="logo">grasp</span>
  <span id="project"></span>
  <span class="review-line" id="reviewline"></span>
  <span class="counts" id="counts"></span>
  <span class="spacer"></span>
  <button id="changesOnlyBtn" title="fold unchanged lines in diffs">changes only <kbd>h</kbd></button>
  <button id="paletteBtn">search <kbd>⌘K</kbd></button>
</header>
<div id="layout">
  <aside id="sidebar">
    <input id="filter" placeholder="filter functions…">
    <h3>Changes</h3>
    <div id="changes"></div>
    <h3>Modules</h3>
    <div id="modules"></div>
  </aside>
  <main id="canvasWrap">
    <svg id="edges"></svg>
    <div id="canvas"><div id="empty">Pick a changed function on the left, or press <kbd>⌘K</kbd>.<br><br>
    Click a call inside a card to open the callee beside it. <kbd>d</kbd> toggles a modified card between source and diff; <kbd>h</kbd> folds unchanged lines. Click a line number to start a comment thread.</div></div>
  </main>
</div>
<div id="palette" hidden>
  <div class="box">
    <input id="palInput" placeholder="search functions…">
    <ul id="palList"></ul>
  </div>
</div>

<script>
'use strict';
let IDX = null, byId = new Map(), COMMENTS = { threads: [] }, CFG = {};
let open = [];              // open card ids, in canvas order
let edges = [];             // {from, to, key}
let cardState = {};         // id -> {view: 'source'|'diff', expanded: Set}
let focusedId = null;
let changesOnly = false;
let composing = null;       // {fnId, file, line, side}

const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

async function loadAll(keepOpen) {
  const [ir, cr, gr] = await Promise.all([
    fetch('/api/index'), fetch('/api/comments'), fetch('/api/config')
  ]);
  if (!ir.ok) { $('#canvas').innerHTML = '<div id="empty">' + esc(await ir.text()) + '</div>'; return; }
  IDX = await ir.json();
  COMMENTS = cr.ok ? await cr.json() : { threads: [] };
  CFG = gr.ok ? await gr.json() : {};
  byId = new Map(IDX.functions.map(f => [f.id, f]));
  if (keepOpen) { open = open.filter(id => byId.has(id)); edges = edges.filter(e => byId.has(e.from) && byId.has(e.to)); }
  renderHeader(); renderSidebar(); renderCanvas();
}

function changedFns() { return IDX.functions.filter(f => f.change !== 'unchanged'); }

function renderHeader() {
  $('#project').textContent = IDX.project.app;
  const g = IDX.git || {};
  const base = (g.base_ref || '').replace(/^origin\//, '');
  $('#reviewline').textContent = base ? base + '…' + (g.branch === 'HEAD' ? (g.head || '').slice(0, 8) : g.branch) : '';
  $('#counts').textContent = changedFns().length + ' changed · ' + IDX.functions.length + ' functions';
}

// ---------- sidebar ----------
function renderSidebar() {
  const ch = changedFns();
  const groups = groupBy(ch, f => f.module);
  $('#changes').innerHTML = ch.length === 0 ? '<div class="side-empty">no changes against the base</div>'
    : [...groups.entries()].map(([mod, fns]) =>
        '<div class="side-mod"><div class="side-modlabel">' + esc(mod) + '</div>' +
        fns.map(sideFn).join('') + '</div>').join('');

  const mods = groupBy(IDX.functions, f => f.module);
  $('#modules').innerHTML = [...mods.entries()].map(([mod, fns]) =>
    '<details class="side-mod"><summary>' + esc(mod) + ' <span style="color:var(--dim)">(' + fns.length + ')</span></summary>' +
    fns.map(sideFn).join('') + '</details>').join('');

  document.querySelectorAll('.side-fn').forEach(el =>
    el.addEventListener('click', () => openCard(el.dataset.id, {})));
  applyFilter();
}

function sideFn(f) {
  return '<div class="side-fn" data-id="' + esc(f.id) + '"><span class="badge ' + f.change + '">' +
    f.change[0].toUpperCase() + '</span><span>' + esc(f.name) + '<span style="color:var(--dim)">/' + f.arity + '</span></span></div>';
}

function groupBy(list, key) {
  const m = new Map();
  for (const it of list) { const k = key(it); if (!m.has(k)) m.set(k, []); m.get(k).push(it); }
  return m;
}

$('#filter').addEventListener('input', applyFilter);
function applyFilter() {
  const q = $('#filter').value.toLowerCase();
  document.querySelectorAll('.side-fn').forEach(el => {
    el.hidden = q !== '' && !el.dataset.id.toLowerCase().includes(q);
  });
  document.querySelectorAll('#modules details').forEach(d => {
    const any = [...d.querySelectorAll('.side-fn')].some(el => !el.hidden);
    d.style.display = any ? '' : 'none';
    if (q !== '') d.open = true;
  });
  document.querySelectorAll('#changes .side-mod').forEach(d => {
    const any = [...d.querySelectorAll('.side-fn')].some(el => !el.hidden);
    d.style.display = any ? '' : 'none';
  });
}

// ---------- canvas ----------
function openCard(id, { fromId, key }) {
  if (!byId.has(id)) return;
  focusedId = id;
  if (open.includes(id)) {
    if (fromId && !edges.some(e => e.from === fromId && e.to === id)) edges.push({ from: fromId, to: id, key });
    renderCanvas();
    const el = cardEl(id); if (el) { el.classList.add('flash'); el.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' }); }
    return;
  }
  const at = fromId ? open.indexOf(fromId) + 1 : open.length;
  open.splice(at, 0, id);
  if (fromId) edges.push({ from: fromId, to: id, key });
  renderCanvas();
  const el = cardEl(id); if (el) el.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
}

function closeCard(id) {
  open = open.filter(x => x !== id);
  edges = edges.filter(e => e.from !== id && e.to !== id);
  if (focusedId === id) focusedId = open[open.length - 1] || null;
  renderCanvas();
}

function cardEl(id) { return document.querySelector('.card[data-id="' + CSS.escape(id) + '"]'); }

function renderCanvas() {
  const canvas = $('#canvas');
  canvas.innerHTML = open.length === 0
    ? '<div id="empty">Pick a changed function on the left, or press <kbd>⌘K</kbd>.</div>' : '';
  for (const id of open) canvas.appendChild(buildCard(byId.get(id)));
  requestAnimationFrame(drawEdges);
}

function buildCard(fn) {
  const st = cardState[fn.id] || (cardState[fn.id] = { view: 'source', expanded: new Set() });
  const card = document.createElement('div');
  card.className = 'card' + (fn.removed ? ' removed-card' : '') + (fn.id === focusedId ? ' focused' : '');
  card.dataset.id = fn.id;

  const showDiff = st.view === 'diff' && fn.base_source != null;
  let dstat = '';
  if (fn.base_source != null) {
    const d = diffLines(fn.base_source.split('\n'), fn.source.split('\n'));
    const plus = d.filter(r => r.t === 'add').length, minus = d.filter(r => r.t === 'del').length;
    dstat = '<span class="dstat"><span class="plus">+' + plus + '</span> <span class="minus">−' + minus + '</span></span>';
  }

  const fileLine = fn.file + ':' + fn.span.start_line;
  const link = editorLink(fn);
  card.innerHTML =
    '<div class="card-head">' +
      '<span class="badge ' + fn.change + '">' + fn.change[0].toUpperCase() + '</span>' +
      '<span class="card-title">' + esc(fn.name) + '<span class="arity">/' + fn.arity + '</span></span>' +
      '<span class="chip">' + esc(fn.kind) + '</span>' + dstat +
      '<span class="card-actions">' +
        (fn.base_source != null ? '<button class="toggleView">' + (showDiff ? 'source' : 'diff') + '</button>' : '') +
        '<button class="closeCard" title="close">×</button>' +
      '</span>' +
    '</div>' +
    '<div class="card-sub"><span>' + esc(fn.module) + '</span>' +
      (link && !fn.removed ? '<a href="' + link + '">' + esc(fileLine) + '</a>'
                           : '<span>' + esc(fileLine) + (fn.removed ? ' (base)' : '') + '</span>') +
    '</div>' +
    '<div class="card-body"></div>';

  const body = card.querySelector('.card-body');
  body.appendChild(showDiff ? diffTable(fn, st) : sourceTable(fn));

  card.addEventListener('mousedown', () => { if (focusedId !== fn.id) { focusedId = fn.id; document.querySelectorAll('.card.focused').forEach(c => c.classList.remove('focused')); card.classList.add('focused'); } });
  const tv = card.querySelector('.toggleView');
  if (tv) tv.addEventListener('click', () => { st.view = showDiff ? 'source' : 'diff'; renderCanvas(); });
  card.querySelector('.closeCard').addEventListener('click', () => closeCard(fn.id));
  return card;
}

function editorLink(fn) {
  const root = IDX.project.root;
  if (!CFG.editor || !root) return null;
  const abs = root + '/' + fn.file, line = fn.span.start_line;
  switch (CFG.editor) {
    case 'vscode': return 'vscode://file/' + abs + ':' + line;
    case 'cursor': return 'cursor://file/' + abs + ':' + line;
    case 'zed': return 'zed://file/' + abs + ':' + line;
    case 'idea': return 'idea://open?file=' + encodeURIComponent(abs) + '&line=' + line;
  }
  return null;
}

// ---------- source view ----------
function sourceTable(fn) {
  const lines = fn.source.split('\n');
  const start = fn.span.start_line;
  const side = fn.removed ? 'base' : 'new';
  const callsByLine = new Map();
  for (const c of fn.calls) {
    const [l1] = c.range.start, [l2] = c.range.end;
    if (l1 !== l2) continue;
    if (!callsByLine.has(l1)) callsByLine.set(l1, []);
    callsByLine.get(l1).push(c);
  }
  const table = mkCodeTable();
  const tbody = table.tBodies[0];
  lines.forEach((text, i) => {
    const abs = start + i;
    const tr = document.createElement('tr');
    tr.innerHTML = '<td class="ln" title="comment on this line">' + abs + '</td><td class="codecell">' +
      lineHTML(text, callsByLine.get(abs) || [], fn.id) + '</td>';
    tr.querySelector('.ln').addEventListener('click', () => startComposer(fn, abs, side));
    tbody.appendChild(tr);
    appendThreadRows(tbody, fn, abs, side, 2);
  });
  wireCalls(table, fn.id);
  return table;
}

function lineHTML(text, calls, fromId) {
  if (calls.length === 0) return esc(text);
  calls.sort((a, b) => a.range.start[1] - b.range.start[1]);
  let out = '', pos = 0;
  for (const c of calls) {
    const s = c.range.start[1] - 1, e = Math.min(c.range.end[1] - 1, text.length);
    if (s < pos || s >= text.length) continue;
    out += esc(text.slice(pos, s));
    const key = c.target + '@' + c.range.start[0] + ':' + c.range.start[1];
    const known = byId.has(c.target);
    out += known
      ? '<a class="call" data-target="' + esc(c.target) + '" data-key="' + esc(key) + '" title="' + esc(c.target) + '">' + esc(text.slice(s, e)) + '</a>'
      : esc(text.slice(s, e));
    pos = e;
  }
  return out + esc(text.slice(pos));
}

function wireCalls(scope, fromId) {
  scope.querySelectorAll('a.call').forEach(a =>
    a.addEventListener('click', () => openCard(a.dataset.target, { fromId, key: a.dataset.key })));
}

// ---------- diff view ----------
function diffLines(a, b) {
  const n = a.length, m = b.length;
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const rows = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { rows.push({ t: 'ctx', text: a[i], o: i + 1, n: j + 1 }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { rows.push({ t: 'del', text: a[i], o: i + 1, n: null }); i++; }
    else { rows.push({ t: 'add', text: b[j], o: null, n: j + 1 }); j++; }
  }
  while (i < n) { rows.push({ t: 'del', text: a[i], o: i + 1, n: null }); i++; }
  while (j < m) { rows.push({ t: 'add', text: b[j], o: null, n: j + 1 }); j++; }
  return rows;
}

function diffTable(fn, st) {
  const rows = diffLines(fn.base_source.split('\n'), fn.source.split('\n'));
  const start = fn.span.start_line;
  const table = mkCodeTable();
  const tbody = table.tBodies[0];

  // Fold runs of unchanged lines when "changes only" is on, keeping 2 lines
  // of context around each change.
  const visible = new Array(rows.length).fill(true);
  if (changesOnly) {
    rows.forEach((r, k) => { visible[k] = r.t !== 'ctx'; });
    rows.forEach((r, k) => {
      if (r.t !== 'ctx') for (let d = -2; d <= 2; d++) if (rows[k + d]) visible[k + d] = true;
    });
  }

  let k = 0, runIdx = 0;
  while (k < rows.length) {
    if (!visible[k] && !st.expanded.has(runIdx)) {
      let e = k;
      while (e < rows.length && !visible[e]) e++;
      const count = e - k, thisRun = runIdx;
      const tr = document.createElement('tr');
      tr.className = 'fold';
      tr.innerHTML = '<td colspan="4">⋯ ' + count + ' unchanged line' + (count > 1 ? 's' : '') + '</td>';
      tr.addEventListener('click', () => { st.expanded.add(thisRun); renderCanvas(); });
      tbody.appendChild(tr);
      k = e; runIdx++;
      continue;
    }
    if (!visible[k]) { /* expanded run */ }
    const r = rows[k];
    const absNew = r.n != null ? start + r.n - 1 : null;
    const tr = document.createElement('tr');
    tr.className = r.t === 'ctx' ? '' : r.t;
    const oldTd = '<td class="ln old" title="comment on the base side">' + (r.o != null ? r.o : '') + '</td>';
    const newTd = '<td class="ln" title="comment on this line">' + (absNew != null ? absNew : '') + '</td>';
    const sign = r.t === 'add' ? '+' : r.t === 'del' ? '−' : '';
    tr.innerHTML = oldTd + newTd + '<td class="sign">' + sign + '</td><td class="codecell">' + esc(r.text) + '</td>';
    const [oldLn, newLn] = tr.querySelectorAll('.ln');
    if (r.o != null) oldLn.addEventListener('click', () => startComposer(fn, r.o, 'base'));
    if (absNew != null) newLn.addEventListener('click', () => startComposer(fn, absNew, 'new'));
    tbody.appendChild(tr);
    if (r.o != null) appendThreadRows(tbody, fn, r.o, 'base', 4);
    if (absNew != null) appendThreadRows(tbody, fn, absNew, 'new', 4);
    k++;
    if (k < rows.length && !visible[k - 1] && visible[k]) runIdx++;
  }
  return table;
}

function mkCodeTable() {
  const t = document.createElement('table');
  t.className = 'code';
  t.appendChild(document.createElement('tbody'));
  return t;
}

// ---------- comments ----------
function threadsAt(fn, line, side) {
  return COMMENTS.threads.filter(t => t.file === fn.file && t.line === line && t.side === side &&
    (t.function === fn.id || byId.get(t.function) == null));
}

function appendThreadRows(tbody, fn, line, side, colspan) {
  for (const t of threadsAt(fn, line, side)) tbody.appendChild(threadRow(t, colspan));
  if (composing && composing.fnId === fn.id && composing.line === line && composing.side === side)
    tbody.appendChild(composerRow(fn, colspan));
}

function threadRow(t, colspan) {
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = colspan;
  const box = document.createElement('div');
  box.className = 'thread' + (t.resolved ? ' resolved' : '');
  box.innerHTML = t.comments.map(c =>
    '<div class="cmt"><div class="who"><span class="avatar">' + esc(initials(c.author)) + '</span>' +
    esc(c.author) + ' · ' + esc((c.at || '').slice(0, 16).replace('T', ' ')) + '</div>' +
    '<div class="body">' + esc(c.body) + '</div></div>').join('') +
    (t.published_url ? '<div class="pub">published: ' + esc(t.published_url) + '</div>' : '') +
    '<textarea placeholder="reply…"></textarea>' +
    '<div class="thread-actions">' +
      '<button class="reply">reply</button>' +
      '<button class="resolve">' + (t.resolved ? 'reopen' : 'resolve') + '</button>' +
      '<button class="del">delete</button>' +
    '</div>';
  const ta = box.querySelector('textarea');
  box.querySelector('.reply').addEventListener('click', () => {
    if (ta.value.trim()) api({ action: 'reply', thread: t.id, body: ta.value });
  });
  ta.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && ta.value.trim()) api({ action: 'reply', thread: t.id, body: ta.value });
  });
  box.querySelector('.resolve').addEventListener('click', () => api({ action: t.resolved ? 'unresolve' : 'resolve', thread: t.id }));
  box.querySelector('.del').addEventListener('click', () => api({ action: 'delete', thread: t.id }));
  td.appendChild(box); tr.appendChild(td);
  return tr;
}

function composerRow(fn, colspan) {
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = colspan;
  const box = document.createElement('div');
  box.className = 'composer';
  box.innerHTML = '<textarea placeholder="leave a comment…"></textarea>' +
    '<div class="row"><button class="send">comment</button><button class="cancel">cancel</button>' +
    '<span class="hint">⌘⏎ to send · esc to cancel</span></div>';
  const ta = box.querySelector('textarea');
  const send = () => { if (ta.value.trim()) {
    api({ action: 'add', function: composing.fnId, file: composing.file, line: composing.line, side: composing.side, body: ta.value });
    composing = null;
  } };
  box.querySelector('.send').addEventListener('click', send);
  box.querySelector('.cancel').addEventListener('click', () => { composing = null; renderCanvas(); });
  ta.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') send();
    if (e.key === 'Escape') { composing = null; renderCanvas(); e.stopPropagation(); }
  });
  td.appendChild(box); tr.appendChild(td);
  setTimeout(() => ta.focus(), 0);
  return tr;
}

function startComposer(fn, line, side) {
  composing = { fnId: fn.id, file: fn.file, line, side };
  renderCanvas();
}

async function api(payload) {
  const r = await fetch('/api/comments', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  if (r.ok) { COMMENTS = await r.json(); renderCanvas(); }
  else alert(await r.text());
}

function initials(name) {
  return (name || '?').split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase();
}

// ---------- edges ----------
function drawEdges() {
  const wrap = $('#canvasWrap'), svg = $('#edges');
  svg.setAttribute('width', wrap.scrollWidth);
  svg.setAttribute('height', wrap.scrollHeight);
  const wr = wrap.getBoundingClientRect();
  const paths = [];
  for (const e of edges) {
    const fromCard = cardEl(e.from), toCard = cardEl(e.to);
    if (!fromCard || !toCard) continue;
    let srcEl = e.key ? fromCard.querySelector('a.call[data-key="' + CSS.escape(e.key) + '"]') : null;
    const sr = (srcEl || fromCard).getBoundingClientRect();
    const trR = toCard.getBoundingClientRect();
    const x1 = sr.right - wr.left + wrap.scrollLeft, y1 = sr.top + sr.height / 2 - wr.top + wrap.scrollTop;
    const x2 = trR.left - wr.left + wrap.scrollLeft, y2 = trR.top + 22 - wr.top + wrap.scrollTop;
    if (x2 < x1) continue; // callee opened to the left after closes: skip the backwards edge
    const mx = (x1 + x2) / 2;
    paths.push('<path d="M' + x1 + ' ' + y1 + ' C' + mx + ' ' + y1 + ', ' + mx + ' ' + y2 + ', ' + x2 + ' ' + y2 +
      '" fill="none" stroke="var(--accent)" stroke-opacity=".45" stroke-width="1.5"/>' +
      '<circle cx="' + x2 + '" cy="' + y2 + '" r="3" fill="var(--accent)" fill-opacity=".7"/>');
  }
  svg.innerHTML = paths.join('');
}
$('#canvasWrap').addEventListener('scroll', () => requestAnimationFrame(drawEdges));
window.addEventListener('resize', () => requestAnimationFrame(drawEdges));

// ---------- palette ----------
let palSel = 0, palItems = [];
function openPalette() { $('#palette').hidden = false; $('#palInput').value = ''; palRender(''); $('#palInput').focus(); }
function closePalette() { $('#palette').hidden = true; }
$('#paletteBtn').addEventListener('click', openPalette);
$('#palette').addEventListener('mousedown', e => { if (e.target === $('#palette')) closePalette(); });
$('#palInput').addEventListener('input', () => palRender($('#palInput').value));
$('#palInput').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { palSel = Math.min(palSel + 1, palItems.length - 1); palPaint(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { palSel = Math.max(palSel - 1, 0); palPaint(); e.preventDefault(); }
  else if (e.key === 'Enter') { if (palItems[palSel]) { openCard(palItems[palSel].id, {}); closePalette(); } }
  else if (e.key === 'Escape') closePalette();
});

function fuzzyScore(needle, hay) {
  needle = needle.toLowerCase(); hay = hay.toLowerCase();
  if (needle === '') return 1;
  let score = 0, j = 0, streak = 0;
  for (let i = 0; i < hay.length && j < needle.length; i++) {
    if (hay[i] === needle[j]) { streak++; score += 1 + streak * 2 + (i === 0 || './_-'.includes(hay[i - 1]) ? 8 : 0); j++; }
    else streak = 0;
  }
  return j === needle.length ? score : -1;
}

function palRender(q) {
  const scored = [];
  for (const f of IDX.functions) {
    const s = fuzzyScore(q, f.id);
    if (s >= 0) scored.push([s + (f.change !== 'unchanged' ? 5 : 0), f]);
  }
  scored.sort((a, b) => b[0] - a[0]);
  palItems = scored.slice(0, 60).map(x => x[1]);
  palSel = 0;
  palPaint();
}

function palPaint() {
  $('#palList').innerHTML = palItems.map((f, i) =>
    '<li data-i="' + i + '" class="' + (i === palSel ? 'sel' : '') + '"><span class="badge ' + f.change + '">' +
    f.change[0].toUpperCase() + '</span><span>' + esc(f.id) + '</span><span class="file">' + esc(f.file) + '</span></li>').join('');
  document.querySelectorAll('#palList li').forEach(li =>
    li.addEventListener('click', () => { openCard(palItems[+li.dataset.i].id, {}); closePalette(); }));
  const sel = document.querySelector('#palList li.sel');
  if (sel) sel.scrollIntoView({ block: 'nearest' });
}

// ---------- keyboard ----------
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') { if (!$('#palette').hidden) closePalette(); else if (composing) { composing = null; renderCanvas(); } }
  if (e.key === 'd' && focusedId) {
    const fn = byId.get(focusedId);
    if (fn && fn.base_source != null) {
      const st = cardState[focusedId];
      st.view = st.view === 'diff' ? 'source' : 'diff';
      renderCanvas();
    }
  }
  if (e.key === 'h') toggleChangesOnly();
});

function toggleChangesOnly() {
  changesOnly = !changesOnly;
  $('#changesOnlyBtn').classList.toggle('on', changesOnly);
  renderCanvas();
}
$('#changesOnlyBtn').addEventListener('click', toggleChangesOnly);

// ---------- live reload ----------
// ?static skips the event stream — for headless rendering and screenshots.
if (!new URLSearchParams(location.search).has('static')) {
  const es = new EventSource('/events');
  es.addEventListener('reload', () => loadAll(true));
}

loadAll(false);
</script>
